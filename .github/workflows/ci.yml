name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make px CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O2"

      - name: Test
        run: make test CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O2"
